name = "highlight"
version = "0.2.0"
description = "Colors code in languages tmdview doesn't know, with highlight.js 11.12.0"

# Take every fenced block tmdview can't color itself (TypeScript, Kotlin, Swift, Dockerfile, ...).
fallback = true

styles = ["styles.css"]
scripts = [
  "vendor/highlight.min.js",
  "vendor/languages/dockerfile.min.js",
  "vendor/languages/elixir.min.js",
  "vendor/languages/haskell.min.js",
  "vendor/languages/nix.min.js",
  "vendor/languages/protobuf.min.js",
  "init.js",
]
